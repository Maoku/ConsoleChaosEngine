<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090f1c" />
    <title>Channel Circuit</title>
    <style>
      :root { color-scheme: dark; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; background: #090f1c; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; grid-template-rows: 1fr auto; overflow: hidden; }
      main { position: relative; min-height: 0; }
      canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; background: #050810; }
      .title { position: absolute; top: 18px; left: 20px; width: 142px; margin: 0; font: 700 16px/1.25 sans-serif; letter-spacing: .14em; text-shadow: 0 2px 0 #000; pointer-events: none; }
      .title span { display: block; }
      .hud { position: absolute; inset: 0; pointer-events: none; color: #fff; text-shadow: 0 2px 0 #000, 0 0 6px #000; font-variant-numeric: tabular-nums; }
      .hud-bar { position: absolute; top: 14px; left: clamp(180px, 30vw, 360px); right: 18px; min-height: 32px; display: grid; grid-template-columns: 1fr auto auto auto; gap: clamp(8px, 2vw, 28px); align-items: center; padding: 6px 10px; background: #07101cba; border: 1px solid #7892a755; }
      .hud-focus { position: absolute; left: 50%; top: 47%; translate: -50% -50%; min-width: min(310px, calc(100% - 32px)); padding: 16px; color: #ffd43b; background: #07101cdd; border: 1px solid #ffd43b88; text-align: center; font: 700 clamp(22px, 6vw, 48px)/1 ui-monospace, monospace; }
      .hud-result { font-size: clamp(15px, 3vw, 24px); line-height: 1.4; }
      .hud-restart { position: absolute; left: 50%; top: calc(47% + 58px); translate: -50% 0; color: #c6d4e4; background: #07101cdd; padding: 7px 12px; font-size: 11px; white-space: nowrap; }
      .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
      .controls { margin: 0; padding: 10px 16px; color: #b9c9dd; background: #0d1728; border-top: 1px solid #263a54; font-size: 12px; text-align: center; }
      [hidden] { display: none !important; }
      @media (max-width: 560px) {
        .title { top: 10px; left: 10px; font-size: 11px; }
        .hud-bar { top: 52px; left: 8px; right: 8px; grid-template-columns: 1fr auto auto; font-size: 10px; }
        [data-hud="time"] { grid-column: 3; }
        .controls { font-size: 10px; padding: 7px; }
      }
    </style>
  </head>
  <body>
    <main>
      <canvas id="game" tabindex="0" aria-label="Channel Circuit race game"></canvas>
      <h1 class="title"><span>CHANNEL</span><span>CIRCUIT</span></h1>
      <section id="racing-hud" class="hud" aria-label="レース状況">
        <div class="hud-bar">
          <span data-hud="generation"></span>
          <span data-hud="lap"></span>
          <span data-hud="rank"></span>
          <span data-hud="time"></span>
        </div>
        <strong class="hud-focus" data-hud="countdown"></strong>
        <strong class="hud-focus hud-result" data-hud="result" hidden></strong>
        <span class="hud-restart" data-hud="restart" hidden>R / GAMEPAD Y: RESTART</span>
        <span class="sr-only" data-hud="announcer" aria-live="polite"></span>
      </section>
    </main>
    <p class="controls">↑/W 加速　↓/S ブレーキ　←→/A D ステア　Q/E 世代切替　1–4 直接切替　R リスタート</p>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
