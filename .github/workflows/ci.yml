name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build workspace exports and CLI
        run: |
          npm run build:engine
          npm run build:testkit
          npm run build:asset-pipeline
          npm rebuild --ignore-scripts --offline
      - run: npm run verify
      - run: npm run verify:distribution
